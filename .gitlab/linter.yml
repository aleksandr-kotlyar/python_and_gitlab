.linter_template:
  stage: Linter
  before_script:
    - pip3 install --no-cache-dir -r requirements-lint.txt;
    - mkdir -p ./pylint;
    - touch __init__.py;
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"'
      changes:
        - '**/*.py'
        - requirements-lint.txt
  tags:
    - macos-local

Pylint:
  extends: .linter_template
  script:
    - pylint --rcfile=.pylintrc $PWD | tee ./pylint/pylint.log
  after_script:
    - PYLINT_SCORE=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' ./pylint/pylint.log 2>/dev/null || true)
    - PYLINT_SCORE=${PYLINT_SCORE:-0}
    - echo $PYLINT_SCORE
    - echo $PYLINT_SCORE > ./pylint/score.log
    - echo $CI_JOB_URL > ./pylint/job_url.log
    - anybadge --overwrite --label="Pylint | ${CI_COMMIT_REF_NAME}" --file=pylint/pylint.svg --value=${PYLINT_SCORE} 2=red 4=orange 8=yellow 10=green
  artifacts:
    when: always
    expire_in: 30d
    paths:
      - ./pylint/


publish-allure-history:
  needs:
    - job: Pytest
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - '**/*.py'
        - requirements.txt
        - pytest.ini
        - .gitlab/.gitlab-ci.yml
        - .gitlab/allure.yml
        - .gitlab/pytest.yml
      when: always

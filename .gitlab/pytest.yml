.pytest_template:
  stage: test
  before_script:
    - python3 -m pip install --upgrade pip
    - pip3 install -r requirements.txt
    - echo $BROWSER
    - echo "${CI_JOB_ID}" > jobid  # for allure report directory name in publish-allure-history
    - function lowercase(){
        echo "$1" | tr '[:upper:]' '[:lower:]';
      }
    - BROWSER=$(lowercase $BROWSER)
  script:
    - pytest ${TESTS} --remote=$REMOTE --browser=$BROWSER
  artifacts:
    expire_in: 2 hours
    when: always
    paths:
      - allure-results
      - jobid
  rules:
    - changes:
        - '**/*.py'
        - requirements.txt
        - pytest.ini
        - .gitlab/.gitlab-ci.yml
        - .gitlab/allure.yml
        - .gitlab/pytest.yml
  tags:
    - macos-local

Pytest:
  extends: .pytest_template
